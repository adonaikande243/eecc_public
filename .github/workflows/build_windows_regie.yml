name: Compilation Windows (Régie Studio)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Déclenchement manuel en 1 clic

jobs:
  build-windows:
    name: Compiler EECC Régie Studio pour Windows (.exe)
    runs-on: windows-2022

    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Activer le support Windows Desktop dans Flutter
        run: flutter config --enable-windows-desktop

      - name: Préparer les répertoires d'assets
        run: |
          New-Item -ItemType Directory -Force -Path "eecc_regie_studio\assets\overlays"
          New-Item -ItemType Directory -Force -Path "eecc_regie_studio\assets\sounds"
          New-Item -ItemType Directory -Force -Path "eecc_regie_studio\assets\logos"
          New-Item -ItemType Directory -Force -Path "eecc_cloud_storage\assets\credentials"

      - name: Dépendances eecc_cloud_storage
        working-directory: eecc_cloud_storage
        run: flutter pub get

      - name: Initialiser le projet Windows et Compiler la Régie Studio
        working-directory: eecc_regie_studio
        run: |
          flutter create --platforms=windows --org org.eecc --project-name eecc_regie_studio .
          flutter pub get
          flutter build windows --release

      - name: Compresser le dossier exécutable de la Régie en ZIP
        run: |
          Compress-Archive -Path "eecc_regie_studio\build\windows\x64\runner\Release\*" -DestinationPath "EECC_Regie_Studio_Windows.zip" -Force

      - name: Publier le logiciel Régie Studio (.zip) comme Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: EECC_Regie_Studio_Windows_Release
          path: EECC_Regie_Studio_Windows.zip
          retention-days: 30
