name: eecc_regie_studio
description: "EECC Régie Studio - Logiciel professionnel de régie et diffusion en direct"
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # Capture caméras physiques HDMI (DirectShow Windows)
  media_kit: ^1.1.10
  media_kit_libs_windows_video: ^1.0.9
  media_kit_video: ^1.2.4
  # WebRTC pour caméras téléphone
  flutter_webrtc: ^0.12.1
  # Serveur WebSocket local (signaling WebRTC)
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1
  # Génération QR Code
  qr_flutter: ^4.1.0
  # FFmpeg (encodage, RTMP, mixage)
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  # Interface Desktop
  window_manager: ^0.4.2
  desktop_drop: ^0.4.4
  # Capture écran
  screen_capturer: ^0.2.1
  # Sélécteur de fichiers
  file_picker: ^8.1.2
  # Gestion état
  provider: ^6.1.2
  # Stockage sécurisé
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  # UUID pour sessions
  uuid: ^4.5.1
  # Réseau
  network_info_plus: ^6.0.1
  http: ^1.2.2
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Intl
  intl: ^0.19.0
  # Cloud Storage (module partagé)
  eecc_cloud_storage:
    path: ../eecc_cloud_storage
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/overlays/
    - assets/sounds/
    - assets/logos/
