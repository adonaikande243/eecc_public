name: eecc_cloud_storage
description: "EECC Cloud Storage - Intégration OneDrive & Google Drive pour archives de cultes"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  mime: ^1.0.6
  crypto: ^3.0.3
  intl: ^0.19.0
  provider: ^6.1.2
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  dart_jsonwebtoken: ^2.14.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/credentials/
